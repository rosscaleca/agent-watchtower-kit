name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    name: Unit tests (Python ${{ matrix.python-version }})
    # Pinned rather than ubuntu-latest: actions/python-versions publishes Python 3.9
    # builds for Ubuntu 22.04 and 24.04 only, so the 3.9 leg would break the day
    # ubuntu-latest moves past 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.14']
    env:
      # Degraded-path tests must work without authenticated GitHub CLI access.
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests with live-write audit
        # Keep in sync with `just test`; the suite needs only the standard library.
        env:
          # Step-level on purpose: the `runner` context is not available in job-level env.
          GH_CONFIG_DIR: ${{ runner.temp }}/gh-unauthed
        run: python3 -W error::ResourceWarning tests/live_write_audit.py -v
